name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run tokens:check
      - run: npm run build
      - run: npm run check:manifest
      # Packs the library and installs it into a fresh app, the way a consumer would.
      - run: npm run smoke:consumer
      - run: npm run build-storybook
      # The website: typecheck, then build and prerender every page.
      - run: npx tsc -p site/tsconfig.json --noEmit
      - run: npm run build:site
