version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only. Lift once it accepts 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
