name: Bug report
description: Something in a component or token doesn't work as documented
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Which component, directive or token is affected?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal snippet or a link to a reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and framework versions
